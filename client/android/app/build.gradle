plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sshovpn.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.sshovpn.app"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    // FITUR BARU: Memisahkan APK berdasarkan Arsitektur
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false // Kita tidak butuh APK universal, cukup yang spesifik
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Kustomisasi nama file APK agar rapi saat diunduh
            applicationVariants.all { variant ->
                variant.outputs.each { output ->
                    def abi = output.getFilter(com.android.build.OutputFile.ABI)
                    if (abi != null) {
                        output.outputFileName = "XaillaXsh-${variant.versionName}-${abi}.apk"
                    }
                }
            }
        }
        debug {
            // Kita gunakan debug signing agar bisa langsung diinstal tanpa setup keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['/META-INF/versions/**', '/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.github.mwiede:jsch:0.2.17'
}
