plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sshovpn.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.sshovpn.app"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"

        // Memastikan APK mendukung semua arsitektur (Universal)
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Opsional: Agar nama file APK jelas
            applicationVariants.all { variant ->
                variant.outputs.all {
                    outputFileName = "XaillaXsh-${variant.versionName}-${variant.buildType.name}.apk"
                }
            }
        }
        debug {
            // Pastikan APK debug juga memiliki konfigurasi bersih
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['/META-INF/versions/**', '/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.github.mwiede:jsch:0.2.17'
}
